# Site settings
title: T. Tony Cai
first_name: Tony
middle_name:
last_name: Cai
description: >
  Academic website of T. Tony Cai, Daniel H. Silberberg Professor of Statistics and Data Science at the Wharton School.
keywords: Tony Cai, statistics, statistical machine learning, high-dimensional statistics, Wharton, University of Pennsylvania
lang: en
icon: penn-shield.ico

url: https://tony-cai.com
baseurl: ""
back_to_top: true

# al-folio core configuration
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
  compat:
    bootstrap:
      enabled: false

# Layout
navbar_fixed: true
footer_fixed: false
search_enabled: false
max_width: 1180px

# Open Graph and Schema.org metadata
serve_og_meta: true
serve_schema_org: true
og_image: /assets/img/tony-cai-og-2026-08.png

# Jekyll
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - bin/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - vendor/
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-cache-bust
  - jekyll-minifier
  - jekyll-sitemap
  - jekyll-terser
  - al_folio_core
  - al_icons
  - al_math

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  # The core styles are already minified. Re-minifying Tailwind v4 CSS breaks
  # spacing variables inside calc(), so JavaScript is delegated to Terser only.
  compress_css: false
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

# Site features
enable_math: true
enable_darkmode: true

# Libraries used by the core layout and publication abstracts
third_party_libraries:
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700&display=swap"
  mathjax:
    integrity:
      js: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
    url:
      js: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
  vanilla-back-to-top:
    integrity:
      js: "sha256-uMJJ3EoTyfRBoTbR+lrfu1uRQ87RZG8AR3cVNuQVeFg="
    url:
      js: "https://cdn.jsdelivr.net/npm/vanilla-back-to-top@7.2.1/dist/vanilla-back-to-top.min.js"
